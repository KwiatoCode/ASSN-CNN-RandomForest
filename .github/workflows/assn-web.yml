name: ASSN — iPhone web

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'ASSN/ASLClassifier.json'
      - 'tools/trained/cnn.pt'
      - '.github/workflows/assn-web.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: assn-web-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install conversion dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install onnx onnxruntime numpy
      - name: Convert YOUR trained CNN to ONNX and validate
        run: |
          python web/export_onnx.py --checkpoint tools/trained/cnn.pt --output web/models/backbone.onnx
          cp ASSN/ASLClassifier.json web/models/forest.json
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('web/models/forest.json')
          f = json.loads(p.read_text(encoding='utf-8'))
          assert len(f['trees']) == 160 and f['featureCount'] == 256 and len(f['classes']) == 26
          print('Random Forest OK:',p.stat().st_size,'bytes')
          PY
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./web
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
