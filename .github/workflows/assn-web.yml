name: ASSN — iPhone (Random Forest from Mac)
on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/assn-web.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: assn-iphone-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Verify files
        run: |
          test -s web/index.html
          test -s web/app.js
          test -s web/forest.js
          test -s web/models/forest.rf.gz
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - uses: actions/deploy-pages@v4
        id: deployment
